<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Black-out — QG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="qg">
  <header>
    <div class="brand">BLACK<span>-</span>OUT · QG</div>
    <div id="timer" class="timer">--:--</div>
    <div class="status">
      <span id="arduino" class="badge">Arduino</span>
      <div id="errors" class="errors"></div>
    </div>
  </header>
  <div id="overlay"><div class="icon"></div><div class="title"></div><div class="sub"></div></div>
  <div class="offline-banner">Connexion au serveur perdue… reconnexion en cours</div>
  <div class="readonly-banner">Lecture seule : la partie se pilote depuis l'écran du QG (pour tester ailleurs : lancer le serveur avec DEV=1)</div>
  <main>
    <section id="screen" class="card"></section>
    <aside class="card chat">
      <h2>Agents terrain</h2>
      <ul id="messages"></ul>
      <div class="quick">
        <button data-q="Reçu">Reçu</button>
        <button data-q="Répétez">Répétez</button>
        <button data-q="On a validé">Validé</button>
        <button data-q="Erreur, vérifiez">Erreur</button>
      </div>
      <form id="form">
        <input id="text" autocomplete="off" maxlength="300" placeholder="Message">
        <button class="primary">OK</button>
      </form>
    </aside>
  </main>
  <section id="dev" class="dev card" hidden>
    <h2>Mode test (sans Arduino)</h2>
    <button data-sim="knob-">Molette −</button>
    <button data-sim="knob+">Molette +</button>
    <button data-sim="KNOBPRESS">Appui molette</button>
    <button data-sim="VALID">Valider</button>
    <button data-sim="TEMP 23.4">Temp 23,4</button>
    <button data-sim="TILT">Pencher</button>
    <button data-sim="BTN 0">◀</button>
    <button data-sim="BTN 1">Basculer</button>
    <button data-sim="BTN 2">▶</button>
    <button data-sim="DIST 145">Main 14,5 cm</button>
    <button data-sim="POT 552">Pot 54 kg</button>
    <button id="reset">Réinitialiser</button>
    <pre id="log"></pre>
  </section>
  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
  <script src="console.js"></script>
</body>
</html>
