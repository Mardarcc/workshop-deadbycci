<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Black-out — Agents terrain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="agents">
  <header>
    <div class="brand">BLACK<span>-</span>OUT</div>
    <div id="timer" class="timer">--:--</div>
    <div id="errors" class="errors"></div>
  </header>
  <div id="overlay"><div class="icon"></div><div class="title"></div><div class="sub"></div></div>
  <div class="offline-banner">Connexion perdue… reconnexion en cours</div>
  <main>
    <section class="card">
      <h2>Module en cours</h2>
      <h1 id="module">En attente du QG…</h1>
      <div id="envelope" class="hint"></div>
    </section>
    <section class="card chat">
      <h2>Chat avec le QG <span class="hint" id="me"></span></h2>
      <ul id="messages"></ul>
      <form id="form">
        <input id="text" autocomplete="off" maxlength="300" placeholder="Message au QG" enterkeyhint="send">
        <button class="primary">Envoyer</button>
      </form>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
  <script src="agents.js"></script>
</body>
</html>
